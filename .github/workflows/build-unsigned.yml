name: Build Unsigned MuseDPI for GBox

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Unsigned XCArchive
        run: |
          xcodebuild -project SwByeDPI.xcodeproj -scheme ByeByeDPI -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MuseDPI.xcarchive" archive PALKA_BUNDLE_ID=app.yam53.taro5888 PALKA_APP_GROUP=group.c2fefdd0db2e255e.1 DEVELOPMENT_TEAM=9U945T6L7A CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Inject Entitlements with ldid & Package IPA
        run: |
          brew install ldid
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/MuseDPI.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          
          APP_PATH=$(find "$RUNNER_TEMP/Payload" -name "*.app" -maxdepth 1)
          
          # Удаляем виджет на случай, если он все же собрался
          rm -rf "$APP_PATH/PlugIns/"*Widget*.appex

          # Создаем файлы прав с нашей App Group и Packet Tunnel
          cat << 'EOF' > "$RUNNER_TEMP/app.entitlements"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.c2fefdd0db2e255e.1</string>
              </array>
          </dict>
          </plist>
          EOF

          # Вшиваем фейковую подпись с нужными правами в основное приложение и в туннель, чтобы GBox их сохранил
          ldid -S"$RUNNER_TEMP/app.entitlements" "$APP_PATH/ByeByeDPI" || ldid -S"$RUNNER_TEMP/app.entitlements" "$APP_PATH/MuseDPI"
          
          TUN_PATH=$(find "$APP_PATH/PlugIns" -name "*.appex" -maxdepth 1)
          if [ -n "$TUN_PATH" ]; then
            ldid -S"$RUNNER_TEMP/app.entitlements" "$TUN_PATH/ByeByeDPITun"
          fi

          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/MuseDPI-GBox-Unsigned.ipa" Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuseDPI-GBox-Unsigned
          path: MuseDPI-GBox-Unsigned.ipa
